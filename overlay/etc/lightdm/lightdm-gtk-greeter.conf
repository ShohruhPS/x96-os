[greeter]
background=/usr/share/backgrounds/x96os/x96os-login.jpg
user-background=false
theme-name=WhiteSur-Dark-solid
icon-theme-name=WhiteSur-dark
cursor-theme-name=WhiteSur-cursors
cursor-theme-size=24
font-name=Inter 11
xft-antialias=true
xft-hintstyle=hintslight
xft-rgba=rgb
default-user-image=/usr/share/pixmaps/x96os-logo.png
indicators=~host;~spacer;~clock;~spacer;~session;~a11y;~power
clock-format=%a %e %b  %H:%M
position=50%,center 62%,center
panel-position=top
hide-user-image=false
round-user-image=true

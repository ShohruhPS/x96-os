# X96 OS: mpv / Celluloid tuned for the S905W
# Hardware video decoding through the Amlogic VPU (V4L2 memory-to-memory decoder).
hwdec=v4l2m2m-copy
hwdec-codecs=h264,mpeg2video,hevc,vp9
# GPU output via OpenGL ES (Lima / Mali-450)
vo=gpu
gpu-api=opengl
opengl-es=yes
profile=fast
video-sync=audio
framedrop=vo
# YouTube & other sites (via yt-dlp): prefer H.264 up to 1080p, which the hardware decodes
ytdl-format=bestvideo[height<=?1080][vcodec^=avc1]+bestaudio/best[height<=?1080][vcodec^=avc1]/best[height<=?1080]
cache=yes
demuxer-max-bytes=64MiB
demuxer-max-back-bytes=16MiB
keep-open=yes
osc=yes

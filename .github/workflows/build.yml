name: Build X96 OS

# Builds both editions (desktop + cli) and publishes them as one release.
# All logic lives in scripts/ci-*.sh, so this file rarely needs to change.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-x96os
  cancel-in-progress: true

env:
  X96OS_VERSION: "1.0"
  DEBIAN_RELEASE: trixie       # Debian 13 base
  BOARD: s905w-x96-mini        # ophub board id 113: X96-Mini, meson-gxl-s905w-x96-mini.dtb
  KERNEL: 6.12.y               # ophub stable LTS kernel, newest 6.12.x is picked automatically

jobs:
  build:
    name: Build ${{ matrix.edition }}
    # Native arm64 runner: the image is customised in a real arm64 chroot, no emulation.
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        edition: [desktop, cli]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare build machine
        id: prep
        run: bash scripts/ci-prepare.sh

      - name: Find the Armbian base image
        id: base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci-find-base.sh

      - name: Package Armbian for the X96 Mini (ophub)
        id: ophub
        uses: ophub/amlogic-s9xxx-armbian@main
        with:
          build_target: armbian
          armbian_path: build/output/images/*.img.gz
          armbian_board: ${{ env.BOARD }}
          armbian_kernel: ${{ env.KERNEL }}
          auto_kernel: true
          armbian_fstype: ext4
          armbian_size: "512/6400"
          builder_name: X96OS

      - name: Build X96 OS (${{ matrix.edition }})
        id: custom
        run: bash scripts/ci-build.sh ${{ matrix.edition }}

      - name: Record outcome
        if: always()
        run: |
          mkdir -p logs
          printf 'edition: %s\nprep: %s\nbase image: %s\nophub packaging: %s\nx96os build: %s\n' \
            "${{ matrix.edition }}" "${{ steps.prep.outcome }}" "${{ steps.base.outcome }}" \
            "${{ steps.ophub.outcome }}" "${{ steps.custom.outcome }}" > logs/outcome.txt

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.edition }}
          path: logs/
          retention-days: 7

      - name: Upload image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.edition }}
          path: out/
          compression-level: 0
          retention-days: 3

  release:
    name: Publish release
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          merge-multiple: true
          path: out
      - uses: actions/download-artifact@v4
        with:
          pattern: logs-*
          path: logs
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci-release.sh

  status:
    name: Report status
    needs: [build, release]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: logs-*
          path: logs
        continue-on-error: true
      - name: Write build-status branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci-status.sh "${{ needs.build.result }}" "${{ needs.release.result }}"

name: Build X96 OS

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-x96os
  cancel-in-progress: true

env:
  X96OS_VERSION: "1.0"
  DEBIAN_RELEASE: trixie       # Debian 13 base
  BOARD: s905w-x96-mini        # ophub board id 113: X96-Mini, meson-gxl-s905w-x96-mini.dtb
  KERNEL: 6.12.y               # ophub stable LTS kernel, newest 6.12.x is picked automatically

jobs:
  build:
    # Native arm64 runner: the image is customised in a real arm64 chroot, no emulation.
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare build machine
        id: prep
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -x
          mkdir -p logs
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc 2>/dev/null || true
          sudo apt-get -y update
          sudo apt-get -y install $(curl -fsSL https://ophub.org/ubuntu2604-build-armbian-depends) || true
          sudo apt-get -y install jq xz-utils pigz parted fdisk e2fsprogs dosfstools rsync git curl \
               python3-numpy python3-pil fonts-inter gtk-update-icon-cache
          df -h /

      - name: Find the Armbian base image (ophub releases)
        id: base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p build/output/images
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/ophub/amlogic-s9xxx-armbian/releases?per_page=60" -o releases.json
          echo "Base-image candidates:"
          jq -r --arg T "Armbian_${DEBIAN_RELEASE}_arm64_" \
            '.[] | select(.tag_name|contains($T)) | .tag_name as $t | .assets[] | select(.name|endswith(".img.gz")) | select(.name|contains("-trunk_")) | "\($t)  \(.name)  \(.updated_at)"' \
            releases.json | head -20 | tee logs/base-candidates.txt
          # Prefer the minimal/server trunk image, newest first; never a desktop one (we add our own desktop).
          pick() {
            jq -r --arg T "Armbian_${DEBIAN_RELEASE}_arm64_" --arg F "$1" \
              '[.[] | select(.tag_name|contains($T)) | .assets[]
                | select(.name|endswith(".img.gz")) | select(.name|contains("-trunk_"))
                | select(.name|test("desktop";"i")|not) | select(.name|test($F;"i"))]
               | sort_by(.updated_at) | reverse | .[0] // empty | "\(.url) \(.name)"' releases.json
          }
          sel="$(pick minimal)"; [ -n "$sel" ] || sel="$(pick server)"; [ -n "$sel" ] || sel="$(pick .)"
          [ -n "$sel" ] || { echo "::error::No Armbian ${DEBIAN_RELEASE} trunk base image found in ophub releases"; exit 1; }
          url="${sel%% *}"; name="${sel#* }"
          echo "Using base image: ${name}" | tee logs/base-image.txt
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/octet-stream" "$url" \
            -o "build/output/images/${name}"
          ls -lh build/output/images

      - name: Package Armbian for the X96 Mini (ophub)
        id: ophub
        uses: ophub/amlogic-s9xxx-armbian@main
        with:
          build_target: armbian
          armbian_path: build/output/images/*.img.gz
          armbian_board: ${{ env.BOARD }}
          armbian_kernel: ${{ env.KERNEL }}
          auto_kernel: true
          armbian_fstype: ext4
          armbian_size: "512/6400"
          builder_name: X96OS

      - name: Turn it into X96 OS
        id: custom
        run: |
          set -o pipefail
          echo "ophub output: ${PACKAGED_OUTPUTPATH} (${PACKAGED_STATUS})"
          ls -lh "${PACKAGED_OUTPUTPATH}"
          [ "${PACKAGED_STATUS}" = "success" ] || { echo "::error::ophub packaging failed"; exit 1; }
          src="$(ls -1 "${PACKAGED_OUTPUTPATH}"/*.img.gz "${PACKAGED_OUTPUTPATH}"/*.img.xz "${PACKAGED_OUTPUTPATH}"/*.img 2>/dev/null | head -n1 || true)"
          [ -n "$src" ] || { echo "::error::no image in ophub output"; exit 1; }
          sudo -E X96OS_VERSION="${X96OS_VERSION}" bash scripts/build-image.sh "$src" "${GITHUB_WORKSPACE}/out" 2>&1 | tee logs/build-image.log

      - name: Publish release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd out
          ls -lh
          img="$(ls -1 X96OS-*.img.xz | head -n1)"
          size=$(stat -c %s "$img")
          [ "$size" -lt 2100000000 ] || { echo "::error::Image is larger than GitHub's 2 GB asset limit ($size bytes)"; exit 1; }
          tag="v${X96OS_VERSION}-build${GITHUB_RUN_NUMBER}"
          {
            echo "## X96 OS ${X96OS_VERSION} for the X96 Mini (Amlogic S905W)"
            echo
            echo "Flash \`${img}\` to a microSD card or USB stick (8 GB or larger) with balenaEtcher or Rufus. No renaming or editing needed."
            echo
            echo "- Login: user \`x96\` / password \`x96os\` (logs in automatically). root password: \`x96os\`"
            echo "- First boot from the card: hold the reset button inside the AV jack with a toothpick while plugging in power, release after ~5 s."
            echo "- Install to internal storage (erases Android): \`sudo armbian-install\`, then pick **113 X96-Mini**."
            echo
            echo "### Build details"
            echo '```'
            cat ../logs/base-image.txt
            cat x96os-build-info.txt 2>/dev/null || true
            echo '```'
            echo
            echo "SHA256: \`$(cut -d' ' -f1 "${img}.sha256")\`"
          } > notes.md
          gh release create "$tag" "$img" "${img}.sha256" --repo "${GITHUB_REPOSITORY}" \
            --title "X96 OS ${X96OS_VERSION} (build ${GITHUB_RUN_NUMBER})" --notes-file notes.md --latest

      - name: Report build status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Writes a status report to the 'build-status' branch so it can be read without Actions access.
          set +e
          d="$(mktemp -d)"
          {
            echo "# X96 OS build status"
            echo
            echo "- run: ${GITHUB_RUN_NUMBER} (id ${GITHUB_RUN_ID}), commit ${GITHUB_SHA}"
            echo "- finished: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "- prep: ${{ steps.prep.outcome }}"
            echo "- base image: ${{ steps.base.outcome }}"
            echo "- ophub packaging: ${{ steps.ophub.outcome }}"
            echo "- customize: ${{ steps.custom.outcome }}"
            echo "- release: ${{ steps.release.outcome }}"
            echo "- job: ${{ job.status }}"
            echo
            for f in logs/base-image.txt logs/base-candidates.txt; do
              [ -f "$f" ] && { echo "## $f"; echo '```'; cat "$f"; echo '```'; }
            done
            if [ -f logs/build-image.log ]; then
              echo "## build-image.log (errors)"; echo '```'
              grep -nE '::error::|^E: |error:|Error |FAILED|failed' logs/build-image.log | tail -60
              echo '```'
              echo "## build-image.log (last 250 lines)"; echo '```'; tail -250 logs/build-image.log; echo '```'
            fi
          } > "$d/STATUS.md"
          cp logs/build-image.log "$d/build-image.log" 2>/dev/null
          cd "$d"
          git init -q && git checkout -q -b build-status
          git config user.name "x96os-builder"; git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -qm "Build ${GITHUB_RUN_NUMBER}: ${{ job.status }}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" build-status
          exit 0
